services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: afridev
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-afridev}
      POSTGRES_DB: afridev
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U afridev -d afridev"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    environment:
      APP_ENV: ${APP_ENV:-production}
      DATABASE_URL: postgresql+asyncpg://afridev:${POSTGRES_PASSWORD:-afridev}@db:5432/afridev
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      DEMO_MODE: ${DEMO_MODE:-false}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_CALLBACK_URL: ${GITHUB_CALLBACK_URL:-http://localhost:8080/api/v1/auth/github/callback}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  db-data:
